# To get started with Dependabot version updates, you'll need to specify which
# package ecosystems to update and where the package manifests are located.
# Please see the documentation for all configuration options:
# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  - package-ecosystem: "npm" # See documentation for possible values
    directory: "/" # Location of package manifests
    schedule:
      interval: "weekly"
    ignore:
      # TypeScript 7 has no JS compiler API, which vue-tsc, vite-plugin-dts and
      # @vue/compiler-sfc still need. Revisit once they support it.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      # PrimeVue 5 / @primeuix/themes 3 moved from MIT to the proprietary PrimeUI
      # License (license key required). Stay on the MIT 4.x line for the demo and tests.
      - dependency-name: "primevue"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@primeuix/themes"
        update-types: ["version-update:semver-major"]
  # Keeps the SHA-pinned actions in .github/workflows up to date.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
